name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.core == 'main' && 'core main' || format('PHP {0} (Craft {1})', matrix.php, matrix.craft) }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # lowest: the oldest Craft composer.json allows that Composer will install
        # (it refuses releases with security advisories), everything else at its newest.
        # highest: everything at its newest.
        craft: [lowest, highest]
        # released: core from Packagist. main: see "core main" below.
        core: [released]
        include:
          # "core main": the newest versions against core's main branch, the
          # gate while core and the addons are developed together (README).
          - php: '8.4'
            craft: highest
            core: main

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: ghostwriter_craft_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.craft }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-${{ matrix.craft }}-
            composer-${{ runner.os }}-php${{ matrix.php }}-

      # "core main" only: core's main branch from GitHub instead of the release
      # on Packagist, aliased to 1.99.0 so it satisfies composer.json's ^1.x.
      # Core is public: no token needed.
      - name: Use core main
        if: matrix.core == 'main'
        run: |
          composer config repositories.core vcs https://github.com/1994limited/ghostwriter-core
          composer require --no-update "1994/ghostwriter-core:dev-main as 1.99.0"

      - name: Install dependencies
        env:
          CRAFT: ${{ matrix.craft }}
        run: |
          flags="--no-interaction --no-progress --prefer-dist"
          # Resolve for the PHP this job runs, as a site on it would.
          composer config --unset platform.php
          if [ "$CRAFT" = lowest ]; then
            composer update $flags --prefer-lowest --prefer-stable --no-install
            craft=$(composer show --locked craftcms/cms --format=json | php -r 'echo json_decode(stream_get_contents(STDIN))->versions[0];')
            composer update $flags --with "craftcms/cms:$craft"
          else
            composer update $flags
          fi
          composer show | grep -E '^(craftcms/cms|craftcms/ckeditor|spicyweb/craft-neo|1994/ghostwriter-core|guzzlehttp/guzzle|symfony/yaml) '

      - name: Test settings
        run: cp tests/.env.example tests/.env

      - name: Tests
        run: vendor/bin/codecept run unit --no-colors

      # The guide's helpers that need no page; Node comes with the runner.
      - name: JavaScript tests
        if: matrix.php == '8.4' && matrix.craft == 'highest'
        run: node --test tests/js/*.test.mjs
